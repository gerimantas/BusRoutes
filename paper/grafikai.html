<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jurginiškiai — Tvarkaraštis</title>
<meta name="description" content="Kauno ir Juragių priemiesčio autobusų (106 maršruto) tvarkaraštis. PWA programėlė greitam ir patogiam laiko sekimui telefone.">
<meta name="theme-color" content="#1a1a1a">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tvarkaraštis">
<link rel="manifest" href="../manifest.json">
<style>
  :root {
    /* 60% — DOMINATING BACKGROUNDS */
    --bg-base: #09090b;       /* Zinc 950 deep canvas */
    --bg-surface: #18181b;    /* Zinc 900 containers */
    --bg-active: #27272a;     /* Zinc 800 active/highlighted items */

    /* 30% — NEUTRAL TYPOGRAPHY & BORDERS */
    --text-primary: #fafafa;  /* Zinc 50 ultra white for primary text */
    --text-secondary: #a1a1aa;/* Zinc 400 silver gray for secondary details */
    --border-subtle: #27272a; /* Zinc 800 subtle dividers and borders */

    /* 10% — SEMANTIC ACCENTS */
    --accent-go: #10b981;     /* Emerald green for success, departures, next trips */
    --accent-wait: #f59e0b;   /* Amber gold for weekend departures and countdowns */
    --accent-stop: #ef4444;   /* Coral red for holidays, danger warnings, inactive filters */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; text-transform: uppercase; }

  .visual-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }

  body {
    background: var(--bg-base);
    color: var(--text-secondary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 18px;
    line-height: 1.3;
    min-height: 100vh;
    padding-bottom: 80vh;
    padding-top: var(--header-h, 90px);
    transition: background 0.35s ease, box-shadow 0.35s ease;
  }

  body.theme-kaunas {
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(126, 200, 255, 0.28), rgba(6, 18, 32, 0) 58%),
      linear-gradient(180deg, rgba(126, 200, 255, 0.08) 0%, rgba(6, 18, 32, 0) 42%),
      #061220;
    box-shadow: inset 0 0 95px rgba(126, 200, 255, 0.22);
  }

  body.theme-jurginiskai {
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(245, 158, 11, 0.30), rgba(20, 10, 0, 0) 58%),
      linear-gradient(180deg, rgba(245, 158, 11, 0.09) 0%, rgba(20, 10, 0, 0) 42%),
      #140a00;
    box-shadow: inset 0 0 95px rgba(245, 158, 11, 0.22);
  }

  header {
    background: var(--bg-surface);
    border-bottom: none;
    padding: 10px 16px 12px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }

  header.theme-kaunas {
    background: linear-gradient(180deg, #153149 0%, #0a1727 62%);
    box-shadow: inset 0 18px 40px rgba(126, 200, 255, 0.25), inset 18px 0 34px rgba(126, 200, 255, 0.14), inset -18px 0 34px rgba(126, 200, 255, 0.14);
  }

  header.theme-jurginiskai {
    background: linear-gradient(180deg, #3a2206 0%, #1c0f00 62%);
    box-shadow: inset 0 18px 40px rgba(245, 158, 11, 0.25), inset 18px 0 34px rgba(245, 158, 11, 0.14), inset -18px 0 34px rgba(245, 158, 11, 0.14);
  }

  #clock-bar {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 24px;
    font-weight: 800;
    color: var(--accent-wait);
    margin-bottom: 8px;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s ease;
  }

  header.theme-kaunas #clock-bar {
    color: #82cbff;
  }

  header.theme-kaunas #clock-time {
    text-shadow: 0 0 12px rgba(126, 200, 255, 0.6);
  }

  header.theme-jurginiskai #clock-bar {
    color: var(--accent-wait);
  }

  header.theme-jurginiskai #clock-time {
    text-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
  }

  #clock-time {
    flex: 1;
    text-align: center;
    transition: text-shadow 0.3s ease;
  }

  #clock-day {
    height: 36px;
    border-radius: 8px;
    background: transparent;
    color: var(--text-primary);
    font-size: 16px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 0 12px;
    border: 1px solid var(--border-subtle);
    letter-spacing: 0.3px;
  }

  header.theme-kaunas #clock-day {
    color: #82cbff;
    border-color: rgba(126, 200, 255, 0.4);
    background: rgba(126, 200, 255, 0.07);
  }

  header.theme-kaunas #clock-day.weekend {
    color: #82cbff;
    border-color: rgba(126, 200, 255, 0.7);
    background: rgba(126, 200, 255, 0.15);
  }

  header.theme-jurginiskai #clock-day {
    color: #ffb347;
    border-color: rgba(245, 158, 11, 0.4);
    background: rgba(245, 158, 11, 0.07);
  }

  header.theme-jurginiskai #clock-day.weekend {
    color: #ffb347;
    border-color: rgba(245, 158, 11, 0.7);
    background: rgba(245, 158, 11, 0.15);
  }

  #clock-day.holiday {
    color: var(--accent-stop);
    border-color: rgba(239, 68, 68, 0.5);
    background: rgba(239, 68, 68, 0.08);
  }

  .tabs {
    display: flex;
    gap: 0;
    border-radius: 0;
    overflow: hidden;
    border: 1px solid var(--border-subtle);
    border-bottom: none;
  }

  .tab-btn {
    flex: 1;
    padding: 12px 8px;
    border: none;
    background: var(--bg-surface);
    color: var(--text-secondary);
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: 0.3px;
    transition: background 0.15s, color 0.15s;
  }

  .tab-btn:first-child {
    border-right: 1px solid var(--border-subtle);
  }

  .tab-btn.active-blue {
    background: #1c2d42;
    color: #82cbff;
    border-bottom: 2px solid #82cbff;
  }

  .tab-btn.active-orange {
    background: #38210b;
    color: #ff9d5c;
    border-bottom: 2px solid #ff9d5c;
  }

  .tab-content {
    display: none;
    padding: 12px 12px 0;
  }

  .tab-content.active {
    display: block;
  }

  #tab-kaunas.active {
    background: linear-gradient(180deg, rgba(126, 200, 255, 0.08) 0%, #061220 34%);
    box-shadow: inset 0 0 70px rgba(126, 200, 255, 0.16);
  }

  #tab-jurginiskai.active {
    background: linear-gradient(180deg, rgba(245, 158, 11, 0.10) 0%, #140a00 34%);
    box-shadow: inset 0 0 70px rgba(245, 158, 11, 0.16);
  }

  .section-title {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1.5px;
    line-height: 1.25;
    color: var(--text-secondary);
    text-transform: uppercase;
    padding: 16px 4px 10px;
  }

  .schedule-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .trip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    padding: 12px 14px;
    border-radius: 0;
    background: var(--bg-surface);
    gap: 6px 0;
  }

  #tab-kaunas .trip {
    background: #0a1727;
    border: 1.5px solid rgba(126, 200, 255, 0.30);
    box-shadow: none;
    transition: box-shadow 0.3s ease, border-color 0.3s ease;
  }

  #tab-kaunas .trip.upcoming {
    border-color: rgba(126, 200, 255, 0.55);
    box-shadow: none;
  }

  #tab-kaunas .trip.platform-12 {
    background: #0a1727;
    border-left: 3px solid #82cbff;
  }

  #tab-kaunas .trip.platform-6 {
    background: #0a1727;
    border-left: 3px solid rgba(126, 200, 255, 0.5);
  }

  #tab-jurginiskai .trip {
    background: #1c0f00;
    border: 1.5px solid rgba(245, 158, 11, 0.30);
    box-shadow: none;
    transition: box-shadow 0.3s ease, border-color 0.3s ease;
  }

  #tab-jurginiskai .trip.upcoming {
    border-color: rgba(245, 158, 11, 0.55);
    box-shadow: none;
  }

  #tab-jurginiskai .trip.platform-tm {
    background: #1c0f00;
    border-left: 3px solid #ffb347;
  }

  .trip.next {
    border: 1.5px solid var(--accent-go) !important;
    box-shadow: none !important;
    position: relative;
    margin-top: 14px;
    scroll-margin-top: calc(var(--header-h, 90px) + 16px);
  }

  .trip.next::before {
    content: 'ARTIMIAUSIAS';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: 0.6px;
    color: var(--accent-go);
    background: inherit;
    padding: 1px 10px;
    border-radius: 4px;
    white-space: nowrap;
  }

  #tab-kaunas .trip.next .time {
    color: var(--accent-go) !important;
    text-shadow: none !important;
  }

  #tab-jurginiskai .trip.next .time {
    color: var(--accent-go) !important;
    text-shadow: none !important;
  }

  .time {
    font-size: 30px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }

  #tab-kaunas .time {
    color: #82cbff; /* Mėlyna bazinė laiko spalva */
  }

  #tab-kaunas .trip.upcoming .time {
    color: #7ec8ff; /* Ryški mėlyna būsimiems reisams */
    text-shadow: none;
  }

  #tab-jurginiskai .time {
    color: #ffb347; /* Gintarinė bazinė laiko spalva */
  }

  #tab-jurginiskai .trip.upcoming .time {
    color: #ff9d5c; /* Ryški gintarinė būsimiems reisams */
    text-shadow: none;
  }

  .time-left {
    font-size: 17px;
    color: var(--text-secondary);
    margin-left: auto;
    padding-left: 12px;
    flex-shrink: 0;
    font-weight: 700;
    line-height: 1.25;
  }

  #tab-kaunas .time-left {
    color: rgba(126, 200, 255, 0.7); /* Šviesiai mėlyna laiko likučio spalva */
  }

  #tab-kaunas .time-left.past {
    color: rgba(126, 200, 255, 0.35); /* Prigesinta mėlyna praėjusiems */
  }

  #tab-kaunas .time-left.soon {
    color: var(--accent-go); /* Paliekama žalia skubiam reikalui */
  }

  #tab-jurginiskai .time-left {
    color: rgba(245, 158, 11, 0.7); /* Šviesiai gintarinė laiko likučio spalva */
  }

  #tab-jurginiskai .time-left.past {
    color: rgba(245, 158, 11, 0.35); /* Prigesinta gintarinė praėjusiems */
  }

  #tab-jurginiskai .time-left.soon {
    color: var(--accent-go); /* Paliekama žalia skubiam reikalui */
  }

  .trip-row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 8px;
  }

  .trip-row2 {
    display: flex;
    align-items: center;
    width: 100%;
    margin-top: 8px;
  }

  .trip-row2:empty {
    display: none;
  }

  .time-left.soon {
    color: var(--accent-go);
    font-weight: 700;
  }

  .time-left.past {
    color: var(--text-secondary);
  }

  .trip.upcoming {
    padding: 20px 14px;
  }

  .trip.upcoming .time {
    font-size: 46px;
  }

  .trip.upcoming .days-label {
    font-size: 17px;
  }

  .trip.upcoming .time-left {
    font-size: 21px;
  }

  .days-row {
    display: flex;
    flex-wrap: nowrap;
    gap: 9px;
    margin-left: auto;
    align-items: flex-end;
  }

  .day-label {
    font-size: 18px;
    font-weight: 800;
    line-height: 1.15;
    padding-bottom: 3px;
  }

  /* Kaunas paletė */
  #tab-kaunas .day-label {
    color: rgba(126, 200, 255, 0.70);
  }

  #tab-kaunas .trip.upcoming .day-label {
    color: rgba(126, 200, 255, 0.85);
  }

  #tab-kaunas .day-label.today {
    color: #82cbff;
    border-bottom: 2px solid #82cbff;
  }

  /* Juragiai paletė */
  #tab-jurginiskai .day-label {
    color: rgba(245, 158, 11, 0.70);
  }

  #tab-jurginiskai .trip.upcoming .day-label {
    color: rgba(245, 158, 11, 0.85);
  }

  #tab-jurginiskai .day-label.today {
    color: #ffb347;
    border-bottom: 2px solid #ffb347;
  }

  .stop-badge {
    font-size: 16px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 6px;
    margin-right: 6px;
    white-space: nowrap;
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border-subtle);
  }

  #tab-kaunas .stop-badge {
    color: #82cbff;
    border-color: rgba(126, 200, 255, 0.4);
    background: rgba(126, 200, 255, 0.07);
  }

  #tab-jurginiskai .stop-badge {
    color: #ffb347;
    border-color: rgba(245, 158, 11, 0.4);
    background: rgba(245, 158, 11, 0.07);
  }

  .platform-badge {
    height: 30px;
    border-radius: 5px;
    font-size: 16px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-right: 6px;
    padding: 0 8px;
    border: 1px solid transparent;
  }

  /* Kaunas: visi ženkleliai mėlynos paletės */
  #tab-kaunas .platform-badge {
    color: #82cbff;
    border-color: rgba(126, 200, 255, 0.4);
    background: rgba(126, 200, 255, 0.07);
  }

  /* Juragiai: visi ženkleliai gintarinės paletės */
  #tab-jurginiskai .platform-badge {
    color: #ffb347;
    border-color: rgba(245, 158, 11, 0.4);
    background: rgba(245, 158, 11, 0.07);
  }

  #holiday-banner {
    text-align: center;
    padding: 8px 12px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.6px;
    line-height: 1.3;
    color: var(--accent-stop);
    border-top: 1px solid rgba(239, 68, 68, 0.25);
    display: none;
  }

  #no-more-banner {
    text-align: center;
    padding: 9px 12px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.7px;
    line-height: 1.35;
  }

  #last-trip-banner {
    text-align: center;
    padding: 8px 12px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.6px;
    line-height: 1.3;
    display: none;
  }

  header.theme-kaunas #no-more-banner,
  header.theme-kaunas #last-trip-banner {
    color: #82cbff;
    border-top: 1px solid rgba(126, 200, 255, 0.25);
  }

  header.theme-jurginiskai #no-more-banner,
  header.theme-jurginiskai #last-trip-banner {
    color: var(--accent-wait);
    border-top: 1px solid rgba(245, 158, 11, 0.25);
  }

  .time-now-line {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    color: var(--accent-go);
    font-size: 14px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: 0.5px;
  }

  .time-now-line::before, .time-now-line::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(16, 185, 129, 0.25);
  }

  #filter-btn {
    height: 36px;
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 0 14px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: 0.5px;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }

  header.theme-kaunas #filter-btn {
    color: #82cbff;
    border-color: rgba(126, 200, 255, 0.4);
    background: rgba(126, 200, 255, 0.07);
  }

  header.theme-jurginiskai #filter-btn {
    color: #ffb347;
    border-color: rgba(245, 158, 11, 0.4);
    background: rgba(245, 158, 11, 0.07);
  }

  #filter-btn.off {
    background: #270808;
    color: var(--accent-stop);
    border-color: var(--accent-stop);
  }

  header.theme-kaunas.filter-off {
    background: #0f0714 !important;
    box-shadow: inset 0 18px 40px rgba(239, 68, 68, 0.42), inset 18px 0 34px rgba(126, 200, 255, 0.12), inset -18px 0 34px rgba(126, 200, 255, 0.12) !important;
  }

  header.theme-jurginiskai.filter-off {
    background: #180500 !important;
    box-shadow: inset 0 18px 40px rgba(239, 68, 68, 0.42), inset 18px 0 34px rgba(245, 158, 11, 0.12), inset -18px 0 34px rgba(245, 158, 11, 0.12) !important;
  }



  .trip.filtered-out {
    display: none;
  }
</style>
</head>
<body class="theme-kaunas">
<h1 class="visual-hidden">Jurginiškių priemiesčio autobusų tvarkaraštis Kaunas ↔ Juragiai</h1>

<header class="theme-kaunas">
  <div id="clock-bar">
    <button id="filter-btn" onclick="toggleFilter()"></button>
    <span id="clock-time"></span>
    <span id="clock-day"></span>
  </div>
  <div class="tabs">
    <button class="tab-btn active-blue" onclick="switchTab('kaunas', this, true)">Kaunas → Juragiai</button>
    <button class="tab-btn" onclick="switchTab('jurginiskai', this, true)">Juragiai → Kaunas</button>
  </div>
  <div id="holiday-banner"></div>
  <div id="last-trip-banner"></div>
  <div id="no-more-banner" style="display:none"></div>
</header>

<!-- TAB: Kaunas → Juragiai -->
<div id="tab-kaunas" class="tab-content active">
  <div class="schedule-list" id="list-kaunas"></div>
</div>

<!-- TAB: Jurginiškiai → Kaunas -->
<div id="tab-jurginiskai" class="tab-content">
  <div class="schedule-list" id="list-jurginiskai"></div>
</div>


<script>
// Duomenys: [laikas, dienų_masyvas]
// Dienų masyvas: [Pr,A,T,K,Pn,Š,S] — true/false
// JS weekday: 0=S, 1=Pr, 2=A, 3=T, 4=K, 5=Pn, 6=Š

const WORKDAYS = [true,  true,  true,  true,  true,  false, false];
const WEEKEND  = [false, false, false, false, false, true,  true ];
const ALL_DAYS = [true,  true,  true,  true,  true,  true,  true ];

const dataKaunas = [
  ["05:00", WORKDAYS, "5"],   // Kaunas-Jonuciai-Skriaudziai
  ["05:50", ALL_DAYS, "5"],   // Skriaudziai (Pr-S) / Jurginiskiai (S)
  ["05:55", WORKDAYS, "5"],   // Jurginiskiai-Skriaudziai
  ["06:45", WORKDAYS, "5"],   // Jurginiskiai-Skriaudziai
  ["06:50", WORKDAYS, "5"],   // Tirkiliskiai-Jurginiskiai
  ["08:00", ALL_DAYS, "12"],  // tarpmiestinis, Marijampole-Vistytis
  ["08:30", WEEKEND,  "5"],   // Garliava-Jurginiskiai
  ["09:05", WORKDAYS, "5"],   // Garliava-Jurginiskiai
  ["09:55", WORKDAYS, "5"],   // Garliava-Jurginiskiai
  ["10:50", WORKDAYS, "5"],   // Garliava-Jurginiskiai
  ["10:55", WEEKEND,  "5"],   // Garliava-Jurginiskiai
  ["11:35", ALL_DAYS, "12"],  // tarpmiestinis, Marijampole-Vilkaviskis
  ["12:00", ALL_DAYS, "12"],  // tarpmiestinis, Marijampole
  ["12:10", WORKDAYS, "5"],   // Jurginiskiai-Skriaudziai
  ["12:35", ALL_DAYS, "5"],   // Skriaudziai (Pr-S) / Jurginiskiai (S)
  ["12:40", ALL_DAYS, "12"],  // tarpmiestinis, Marijampole-Vilkaviskis
  ["13:30", WORKDAYS, "5"],   // Jurginiskiai-Skriaudziai
  ["14:00", WORKDAYS, "5"],   // Jurginiskiai-Skriaudziai
  ["14:50", WORKDAYS, "5"],   // Jurginiskiai-Skriaudziai
  ["15:15", WEEKEND,  "5"],   // Garliava-Jurginiskiai
  ["15:30", WORKDAYS, "5"],   // Jurginiskiai-Skriaudziai
  ["16:00", WORKDAYS, "5"],   // Garliava-Jurginiskiai
  ["16:25", WORKDAYS, "5"],   // Garliava-Jurginiskiai
  ["16:50", ALL_DAYS, "12"],  // tarpmiestinis, Marijampole-Vilkaviskis
  ["17:30", WORKDAYS, "5"],   // Jurginiskiai-Skriaudziai
  ["18:40", WORKDAYS, "5"],   // Jurginiskiai-Skriaudziai
  ["19:30", WORKDAYS, "5"],   // Garliava-Jurginiskiai
];

const dataJurginiskai = [

function getDayClass(days) {
  const wd = days.slice(0,5).every(Boolean);
  const sat = days[5];
  const sun = days[6];
  if (wd && sat && sun) return "all-days";
  if (wd && !sat && !sun) return "workday";
  if (!wd && sat && sun) return "weekend";
  if (!wd && sat && !sun) return "saturday";
  if (!wd && !sat && sun) return "sunday";
  return "all-days";
}


function getTodayIdx(now) {
  now = now || new Date();
  const jsDay = now.getDay();
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");
  if (HOLIDAYS.some(h => h.date === `${mm}-${dd}`)) return 5;
  return jsDay === 0 ? 6 : jsDay - 1;
}

function renderDays(days, now) {
  const labels = ["1","2","3","4","5","6","7"];
  const todayIdx = getTodayIdx(now);
  return days.map((on, i) => {
    if (!on) return "";
    const cls = "day-label" + (i === todayIdx ? " today" : "");
    return `<span class="${cls}">${labels[i]}</span>`;
  }).filter(Boolean).join("");
}

function timeToMinutes(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}

// Iš anksto konvertuojame laiko eilutes į minutes nuo vidurnakčio
function precalculateTripMinutes(data) {
  for (let i = 0; i < data.length; i++) {
    if (data[i].length === 3) {
      data[i].push(timeToMinutes(data[i][0]));
    }
  }
}
precalculateTripMinutes(dataKaunas);
precalculateTripMinutes(dataJurginiskai);

// Gauss algorithm — returns [month, day] of Easter Sunday for given year
function easterDate(year) {
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return [month, day];
}

function buildHolidays(year) {
  const [em, ed] = easterDate(year);
  const pad = n => String(n).padStart(2, "0");
  const easterMonday = new Date(year, em - 1, ed + 1);
  const em2 = easterMonday.getMonth() + 1;
  const ed2 = easterMonday.getDate();
  return [
    { date: "01-01", name: "Naujieji metai" },
    { date: "02-16", name: "Vasario 16-oji" },
    { date: "03-11", name: "Kovo 11-oji" },
    { date: `${pad(em)}-${pad(ed)}`,   name: "Velykos" },
    { date: `${pad(em2)}-${pad(ed2)}`, name: "Velykų pirmadienis" },
    { date: "05-01", name: "Tarptautinė darbo diena" },
    { date: "06-24", name: "Joninės" },
    { date: "07-06", name: "Valstybės diena" },
    { date: "08-15", name: "Žolinė" },
    { date: "11-01", name: "Visų Šventųjų diena" },
    { date: "11-02", name: "Vėlinės" },
    { date: "12-24", name: "Kūčios" },
    { date: "12-25", name: "Kalėdos" },
    { date: "12-26", name: "Kalėdų antroji diena" },
  ];
}

let currentYear = new Date().getFullYear();
let HOLIDAYS = buildHolidays(currentYear);

function checkYearUpdate(now) {
  const year = now.getFullYear();
  if (year !== currentYear) {
    currentYear = year;
    HOLIDAYS = buildHolidays(currentYear);
  }
}

function getHolidayName(mmdd) {
  const h = HOLIDAYS.find(h => h.date === mmdd);
  return h ? h.name : null;
}

function runsToday(days, now) {
  return days[getTodayIdx(now)];
}

function renderList(data, containerId, now) {
  const container = document.getElementById(containerId);
  if (!container) return;

  // Naudojame sekundes tiksliam „dabar“ aptikimui tos pačios minutės ribose
  const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

  // Next = pirmasis reisas šiandien, kuris dar pilnai neišvyko
  let nextIdx = -1;
  let tripsLeft = 0;
  let lastTripMin = 0;
  for (let i = 0; i < data.length; i++) {
    const [time, days, platform, tripMin] = data[i];
    if (runsToday(days, now) && (tripMin * 60 + 59) >= nowSec) {
      if (nextIdx === -1) nextIdx = i;
      tripsLeft++;
      lastTripMin = tripMin;
    }
  }

  const hasMoreToday = nextIdx !== -1;

  let html = "";
  let shownNextLine = false;

  for (let i = 0; i < data.length; i++) {
    const [time, days, platform, tripMin] = data[i];
    const minSec = tripMin * 60;
    const todayRuns = runsToday(days, now);
    const isNext = i === nextIdx;

    if (isNext && !shownNextLine) {
      shownNextLine = true;
    }

    const dayClass = getDayClass(days);
    const diffSec = minSec - nowSec;
    const diffMin = Math.round(diffSec / 60);
    const isUpcoming = todayRuns && diffSec > 0;
    const isAlt = platform && platform !== "5";
    const isFilteredOut = filterOn && !todayRuns;

    let classes = `trip ${dayClass}`;
    if (isUpcoming) classes += " upcoming";
    if (isNext) classes += " next";
    if (isAlt) classes += ` platform-${platform}`;
    if (isFilteredOut) classes += " filtered-out";

    const pLabel = (platform && !["106","tm"].includes(platform)) ? platform + "a" : platform;
    const platformBadge = platform
      ? `<div class="platform-badge p${platform}">${pLabel}</div>`
      : "";

    let timeLeftHtml = "";
    if (todayRuns) {
      if (diffSec > 0) {
        let label;
        if (diffSec < 60) {
          label = "už < 1 min";
        } else {
          const h = Math.floor(diffMin / 60);
          const m = diffMin % 60;
          label = h > 0 ? `už ${h} val ${m} min` : `už ${m} min`;
        }
        const soon = diffMin <= 15 ? " soon" : "";
        timeLeftHtml = `<div class="time-left${soon}">${label}</div>`;
      } else if (diffSec > -60) {
        timeLeftHtml = `<div class="time-left soon">dabar</div>`;
      } else {
        const pd = Math.abs(diffMin);
        const ph = Math.floor(pd / 60);
        const pm = pd % 60;
        const plabel = ph > 0 ? `prieš ${ph} val ${pm} min` : `prieš ${pm} min`;
        timeLeftHtml = `<div class="time-left past">${plabel}</div>`;
      }
    }

    html += `
      <div class="${classes}">
        <div class="trip-row1">
          <div class="time">${time}</div>
          <div class="days-row">${renderDays(days, now)}</div>
        </div>
        <div class="trip-row2">
          ${platformBadge}
          ${timeLeftHtml}
        </div>
      </div>`;
  }

  container.innerHTML = html;
  container.dataset.noMore = hasMoreToday ? "0" : "1";
  container.dataset.tripsLeft = tripsLeft;
  container.dataset.lastMin = tripsLeft === 1 ? Math.round((lastTripMin * 60 - nowSec) / 60) : "";
  container.dataset.nextMin = nextIdx !== -1 ? Math.round((data[nextIdx][3] * 60 - nowSec) / 60) : "";
  container.dataset.nextTime = nextIdx !== -1 ? data[nextIdx][0] : "";
  updateNoMoreBanner();
}

function updateNoMoreBanner() {
  const activeTab = document.querySelector(".tab-content.active");
  const list = activeTab ? activeTab.querySelector(".schedule-list") : null;
  const banner = document.getElementById("no-more-banner");
  const lastBanner = document.getElementById("last-trip-banner");
  if (!banner) return;

  if (list && list.dataset.noMore === "1") {
    banner.textContent = "Šiandien reisų nebėra";
    banner.style.display = "block";
    if (lastBanner) lastBanner.style.display = "none";
  } else {
    banner.style.display = "none";
    // Show warning if only 1 trip left today
    if (lastBanner && list && list.dataset.tripsLeft === "1") {
      lastBanner.textContent = "Paskutinis autobusas šiandien — už " + list.dataset.lastMin + " min";
      lastBanner.style.display = "block";
    } else if (lastBanner) {
      lastBanner.style.display = "none";
    }
  }
}

function scrollToNext() {
  const activeTab = document.querySelector(".tab-content.active") || document.body;
  const next = activeTab.querySelector(".trip.next");
  if (!next) return;

  // Saugumo patikra: jei elementas dar pilnai neišdėstytas ekrane, palaukiame trumpą laiką
  const rect = next.getBoundingClientRect();
  if (rect.height === 0 || rect.top === 0) {
    setTimeout(scrollToNext, 40);
    return;
  }

  const header = document.querySelector("header");
  const headerH = header ? header.offsetHeight : 90;
  const safeTopGap = 12;
  
  // Apskaičiuojame absoliutų Y tašką dokumente ir pritaikome didesnį saugų atstumą,
  // kad "ARTIMIAUSIAS" žyma nepalįstų po fiksuotu header.
  const elementAbsoluteTop = rect.top + window.pageYOffset;
  const targetScrollY = Math.max(0, elementAbsoluteTop - headerH - safeTopGap);

  window.scrollTo({ top: targetScrollY, behavior: "instant" });
}

function switchTab(name, btn, isManual) {
  if (isManual) {
    userInteracted = true;
  }
  document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active-blue", "active-orange"));
  document.getElementById("tab-" + name).classList.add("active");
  btn.classList.add(name === "kaunas" ? "active-blue" : "active-orange");
  
  const header = document.querySelector("header");
  const body = document.body;
  if (header) {
    header.classList.remove("theme-kaunas", "theme-jurginiskai");
    header.classList.add("theme-" + name);
  }
  if (body) {
    body.classList.remove("theme-kaunas", "theme-jurginiskai");
    body.classList.add("theme-" + name);
  }

  updateNoMoreBanner();
  // Padidinome laiką iki 80ms, kad naršyklė spėtų atlikti stilių perpynimą (reflow)
  setTimeout(scrollToNext, 80);
}

let filterOn = true;
let userInteracted = false;

function filterBtnLabel(now, todayIdx) {
  if (!filterOn) return "1-7";
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");
  if (HOLIDAYS.some(hd => hd.date === `${mm}-${dd}`)) return "ND";
  todayIdx = todayIdx !== undefined ? todayIdx : getTodayIdx(now);
  return (todayIdx === 5 || todayIdx === 6) ? "6-7" : "1-5";
}

function toggleFilter() {
  userInteracted = true;
  filterOn = !filterOn;
  const btn = document.getElementById("filter-btn");
  const header = document.querySelector("header");
  btn.classList.toggle("off", !filterOn);
  header.classList.toggle("filter-off", !filterOn);
  // refresh() rewrites the label via updateClock() with its own `now`,
  // so don't create a second clock reading here.
  refresh();
  setTimeout(scrollToNext, 80);
}

function updateClock(now) {
  const h = String(now.getHours()).padStart(2,"0");
  const m = String(now.getMinutes()).padStart(2,"0");
  const todayIdx = getTodayIdx(now);
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");
  const isHoliday = HOLIDAYS.some(hd => hd.date === `${mm}-${dd}`);
  const isWeekend = todayIdx === 5 || todayIdx === 6;

  document.getElementById("clock-time").textContent = `${h}:${m}`;

  const dayEl = document.getElementById("clock-day");
  const dayNum = todayIdx + 1;
  dayEl.textContent = isHoliday ? `${dayNum} - ND` : dayNum;
  dayEl.className = isHoliday ? "holiday" : (isWeekend ? "weekend" : "");

  const btn = document.getElementById("filter-btn");
  if (btn) btn.textContent = filterBtnLabel(now, todayIdx);

  const holidayBanner = document.getElementById("holiday-banner");
  if (holidayBanner) {
    const name = getHolidayName(`${mm}-${dd}`);
    if (name) {
      holidayBanner.textContent = name;
      holidayBanner.style.display = "block";
    } else {
      holidayBanner.style.display = "none";
    }
  }
}

let lastVibratedTrip = "";

function refresh() {
  const now = new Date();
  checkYearUpdate(now);
  updateClock(now);
  renderList(dataKaunas, "list-kaunas", now);
  renderList(dataJurginiskai, "list-jurginiskai", now);
  
  // Sync header height so body padding-top matches actual header
  const header = document.querySelector("header");
  if (header) {
    document.documentElement.style.setProperty("--header-h", header.offsetHeight + "px");
  }

  // Taktilinis perspėjimas: telefonas suvirpa likus <= 2 min iki artimiausio reiso aktyviame Tab'e
  const activeTab = document.querySelector(".tab-content.active");
  const list = activeTab ? activeTab.querySelector(".schedule-list") : null;
  if (list && list.dataset.nextMin && list.dataset.nextTime) {
    const nextMin = parseInt(list.dataset.nextMin, 10);
    const nextTime = list.dataset.nextTime;
    if (nextMin > 0 && nextMin <= 2 && lastVibratedTrip !== `${activeTab.id}-${nextTime}`) {
      if ('vibrate' in navigator) {
        navigator.vibrate([200, 100, 200]);
      }
      lastVibratedTrip = `${activeTab.id}-${nextTime}`;
    }
  }
}

let refreshTimeout = null;
let refreshInterval = null;

function scheduleRefresh() {
  if (refreshTimeout) clearTimeout(refreshTimeout);
  if (refreshInterval) clearInterval(refreshInterval);

  const now = new Date();
  // Align next tick to the start of the next minute
  const msToNextMin = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();
  refreshTimeout = setTimeout(() => {
    refresh();
    refreshInterval = setInterval(refresh, 60000);
  }, msToNextMin);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    refresh();
    scheduleRefresh();
  }
});

// Geolokacija: automatinis krypties (tabo) parinkimas pagal fizinį vartotojo atstumą
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371; // km
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function autoSelectTabByLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(position => {
    if (userInteracted) return; // Jei vartotojas jau atliko rankinius veiksmus, geolokacija skirtuko nekeičia
    const uLat = position.coords.latitude;
    const uLon = position.coords.longitude;
    
    // Kauno autobusų stotis: 54.8893, 23.9279
    // Juragiai: 54.8055, 23.8652
    const distToKaunas = getDistance(uLat, uLon, 54.8893, 23.9279);
    const distToJuragiai = getDistance(uLat, uLon, 54.8055, 23.8652);
    
    const activeTab = document.querySelector(".tab-content.active");
    const currentTabId = activeTab ? activeTab.id : "";
    
    if (distToKaunas < distToJuragiai) {
      if (currentTabId !== "tab-kaunas") {
        const btn = document.querySelector(".tab-btn[onclick*='kaunas']");
        if (btn) switchTab('kaunas', btn);
      }
    } else {
      if (currentTabId !== "tab-jurginiskai") {
        const btn = document.querySelector(".tab-btn[onclick*='jurginiskai']");
        if (btn) switchTab('jurginiskai', btn);
      }
    }
  }, error => {
    console.log("Geolocation error or blocked:", error.message);
  }, { timeout: 10000 });
}

refresh();
setTimeout(scrollToNext, 50);
scheduleRefresh();
autoSelectTabByLocation();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../sw.js', { updateViaCache: 'none' }).then(reg => {
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      if (newWorker) {
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // New version ready, reload to activate
            window.location.reload();
          }
        });
      }
    });
  });
}
