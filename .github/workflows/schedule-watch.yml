name: Schedule Watch

# Checks the live timetable against what the app ships, from two sources in
# order of priority:
#   1. autobusubilietai.lt search — the primary source. Its result is what the
#      app shows riders, and a change opens a "Schedule changed" issue.
#   2. krs.lt route 106 PDFs — the secondary source. A difference or a failed
#      check opens its own "krs.lt PDFs" issue and never touches the app status.
# Opens a GitHub issue ONLY when something needs a look — GitHub emails the
# issue to the repo owner, so a quiet day sends nothing at all.
# Every run also publishes the primary result to the `status` branch; the app
# reads it and shows the rider when the timetable was last checked.

on:
  schedule:
    - cron: '0 4 * * *'   # 07:00 Vilnius summer, 06:00 winter
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write         # push status.json to the `status` branch
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firecrawl CLI and pypdf
        run: |
          npm install -g firecrawl-cli
          pip install pypdf==6.19.0

      - name: Check the timetable
        id: check
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          set +e
          python scripts/check_schedule.py --json diff.json > report.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          # The exit code covers autobusubilietai.lt only; krs.lt's result is in
          # the JSON report (ok, changed, failed or skipped).
          krs=$(jq -r '."krs.lt".result // "unknown"' diff.json 2>/dev/null || echo unknown)
          echo "krs=$krs" >> "$GITHUB_OUTPUT"
          set -e
          cat report.txt

      - name: Open an issue when the timetable changed
        if: steps.check.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Identify the difference itself, not the run: the dates line moves daily.
          # Only the primary section counts; krs.lt has its own issue.
          diff_id=$(sed '/^krs\.lt (municipality/,$d' report.txt \
                      | grep -v -e '^Checking against' -e '^App switches' -e 'rate limited' \
                      | sha1sum | cut -c1-12)
          {
            echo "autobusubilietai.lt (the primary source) no longer matches the app — see the direction with the difference."
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "**To update:** open the project in Claude Code and say \`atnaujink grafikus\`."
            echo
            echo "Checked $(date -u '+%Y-%m-%d %H:%M UTC') by [Schedule Watch](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            echo "<!-- diff:$diff_id -->"
          } > body.md

          # One open issue per change. A later run with the same difference adds
          # nothing; a different difference is added to the open issue as a comment.
          open=$(gh issue list --state open --search "Schedule changed in:title" \
                   --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            if gh issue view "$open" --json body,comments --jq '.body, .comments[].body' \
                 | grep -q "diff:$diff_id"; then
              echo "Issue #$open already reports this difference — nothing to add."
            else
              gh issue comment "$open" --body-file body.md
            fi
            exit 0
          fi

          gh issue create \
            --title "Schedule changed — $(date -u '+%Y-%m-%d')" \
            --body-file body.md \
            --label "schedule-change" \
            || gh issue create \
                 --title "Schedule changed — $(date -u '+%Y-%m-%d')" \
                 --body-file body.md

      - name: Open an issue when the check itself failed
        if: steps.check.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A failed check is not an all-clear — silence here would be the exact
          # failure mode this workflow exists to prevent.
          if gh issue list --state open --search "Schedule Watch could not run in:title" \
               --json number --jq 'length' | grep -qv '^0$'; then
            echo "An open failure issue already exists — not filing another."
            exit 0
          fi

          {
            echo "Schedule Watch ran but could not complete the comparison."
            echo "The timetable may or may not have changed — this is not an all-clear."
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > body.md

          gh issue create --title "Schedule Watch could not run" --body-file body.md

      - name: Open an issue when the krs.lt PDFs need a look
        if: steps.check.outputs.krs == 'changed' || steps.check.outputs.krs == 'failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KRS: ${{ steps.check.outputs.krs }}
        run: |
          # The secondary source: worth an email, never the app's status.
          sed -n '/^krs\.lt (municipality/,/^krs\.lt: /p' report.txt > krs.txt
          diff_id=$(sha1sum < krs.txt | cut -c1-12)
          if [ "$KRS" = changed ]; then
            what="differ from the app"
          else
            what="could not be checked"
          fi
          {
            echo "The krs.lt route 106 PDFs (the secondary source) $what."
            echo "autobusubilietai.lt, the primary source, decides what the app shows; this does not change the app status."
            echo
            echo '```'
            cat krs.txt
            echo '```'
            echo
            echo "**To look into it:** open the project in Claude Code and say \`atnaujink grafikus\`."
            echo
            echo "Checked $(date -u '+%Y-%m-%d %H:%M UTC') by [Schedule Watch](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            echo "<!-- diff:$diff_id -->"
          } > body.md

          # One open issue at a time, as for the primary source.
          open=$(gh issue list --state open --search "krs.lt PDFs in:title" \
                   --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            if gh issue view "$open" --json body,comments --jq '.body, .comments[].body' \
                 | grep -q "diff:$diff_id"; then
              echo "Issue #$open already reports this — nothing to add."
            else
              gh issue comment "$open" --body-file body.md
            fi
            exit 0
          fi
          gh issue create --title "krs.lt PDFs $what — $(date -u '+%Y-%m-%d')" --body-file body.md

      - name: Publish the result for the app
        if: always()
        env:
          CODE: ${{ steps.check.outputs.exit_code }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Anything other than a clean 0 or 1 (including a step that never ran)
          # is reported as a failed check, never as all-clear.
          case "$CODE" in
            0) result=ok ;;
            1) result=changed ;;
            *) result=failed ;;
          esac
          dir="$RUNNER_TEMP/status"
          mkdir -p "$dir" && cd "$dir"
          printf '{"checked":"%s","result":"%s"}\n' \
            "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" > status.json
          # One orphan commit, force-pushed: the branch holds only the latest result.
          git init -q -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -q -m "Schedule check: $result"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" status
          cat status.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-report
          path: |
            report.txt
            diff.json
          if-no-files-found: ignore
          retention-days: 30
