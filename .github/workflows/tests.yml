name: Tests

# Offline tests for the schedule watcher (tests/). Runs when the watcher, its
# fixtures or the app data it reads change. No network, no secrets.

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'paper/grafikai.html'
      - '.github/workflows/tests.yml'
  # No pull_request trigger: the only pull requests here are the ones Schedule
  # Watch opens with GITHUB_TOKEN, and on those GitHub creates a run that fails
  # at start-up with no jobs (2026-10-09, PR #8) — a red mark on a good draft.
  # The watcher runs these tests itself before opening the PR, and the merge
  # push runs them again.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'

      # Pinned: the PDF tests compare against text this version extracts.
      - name: Install pypdf
        run: pip install pypdf==6.19.0

      - name: Run tests
        run: python -m unittest discover -s tests -v
