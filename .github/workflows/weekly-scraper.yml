name: Weekly Schedule Scraper

on:
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday at 6:00 UTC (9:00 Vilnius summer, 8:00 winter)
  workflow_dispatch:     # Also allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape-and-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium
      
      - name: Run scraper
        run: |
          python scripts/scrape_juragiai.py
      
      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain web/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in web/:"
            git status --porcelain web/
            git diff --stat web/
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes in web/"
          fi
      
      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update scraped schedules"
          branch: scrape-${{ github.run_number }}
          delete-branch: true
          title: "🚌 Weekly Schedule Update"
          body: |
            ## Automated Schedule Scrape
            
            **Source:** autobusubilietai.lt  
            **Date:** ${{ github.run_id }}  
            **Trigger:** ${{ github.event_name }}
            
            ### Files Updated:
            - `web/106_kaunas-juragiai_pilnas.md`
            - `web/106_juragiai-kaunas_pilnas.md`
            - `web/tarpmiestiniai_kaunas-juragiai_pilnas.md`
            - `web/tarpmiestiniai_juragiai-kaunas_pilnas.md`
            
            ### Review Checklist:
            - [ ] Trip counts reasonable (±20% from current)?
            - [ ] All times valid (05:00-23:59)?
            - [ ] Periodicities correct (WORKDAYS/WEEKEND/ALL_DAYS)?
            - [ ] No duplicate trips?
            
            ### Next Steps:
            1. Review the diff below
            2. If data looks good → **Merge**
            3. If suspicious → **Close** and investigate manually
            
            ---
            
            _This PR was created automatically by GitHub Actions._
          labels: |
            automation
            schedule-update
      
      - name: Generate summary
        if: always()
        run: |
          echo "## Scraper Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "web/106_kaunas-juragiai_pilnas.md" ]; then
            echo "### Trip Counts:" >> $GITHUB_STEP_SUMMARY
            for file in web/*_pilnas.md; do
              count=$(grep -c "^|" "$file" | awk '{print $1 - 2}')
              echo "- $(basename $file .md): **$count trips**" >> $GITHUB_STEP_SUMMARY
            done
          fi
