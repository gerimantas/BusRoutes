name: Update Bus Schedule

on:
  # Kas sekmadienį 6:00 UTC (9:00 Vilniaus laiku vasarą, 8:00 žiemą)
  schedule:
    - cron: '0 6 * * 0'
  
  # Rankinis paleidimas per GitHub UI
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          pip install playwright
          playwright install chromium
      
      - name: Run scraper
        run: |
          python notused/scrape_juragiai.py
        continue-on-error: false
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet web/; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "✓ No changes detected in web/ directory"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "✓ Changes detected in web/ directory"
            git diff --stat web/
          fi
      
      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'update: automated schedule scrape from autobusubilietai.lt'
          title: 'Automated Schedule Update - ${{ github.run_id }}'
          body: |
            ## 🤖 Automated Schedule Update
            
            This PR contains schedule data scraped from autobusubilietai.lt
            
            **Run date:** ${{ github.event.schedule || 'Manual trigger' }}
            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            ### Files updated:
            - `web/106_kaunas-juragiai_pilnas.md`
            - `web/106_juragiai-kaunas_pilnas.md`
            - `web/tarpmiestiniai_kaunas-juragiai_pilnas.md`
            - `web/tarpmiestiniai_juragiai-kaunas_pilnas.md`
            
            ### ⚠️ Manual Review Required
            
            Before merging:
            1. Compare trip counts with current production
            2. Spot-check 3-5 random trip times
            3. Verify periodicities (WORKDAYS/WEEKEND/ALL_DAYS)
            4. **Real-world validation:** Visit bus station to confirm
            
            See `SKILL.md` section "Web Scraping Automation" for full verification workflow.
          branch: automated-schedule-update
          delete-branch: true
          labels: |
            automation
            schedule-update
      
      - name: No changes detected
        if: steps.check_changes.outputs.changes == 'false'
        run: |
          echo "No schedule changes detected. Skipping PR creation."
