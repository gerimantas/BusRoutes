  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #00f2fe;
      --primary-glow: rgba(0, 242, 254, 0.35);
      --secondary: #4facfe;
      --accent: #ff007f;
      --accent-glow: rgba(255, 0, 127, 0.35);
      --success: #10b981;
      --warning: #f59e0b;
      --skelbiu: #3b82f6;
      --autoplius: #10b981;
      --autogidas: #f97316;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 0, 127, 0.05) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 2rem 1.5rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header Section */
    header {
      text-align: center;
      margin-bottom: 3rem;
      position: relative;
    }

    .header-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 0 20px var(--primary-glow);
      margin-bottom: 1rem;
      animation: pulse 3s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 15px var(--primary-glow); }
      50% { box-shadow: 0 0 30px rgba(0, 242, 254, 0.6); }
      100% { box-shadow: 0 0 15px var(--primary-glow); }
    }

    .header-logo svg {
      width: 32px;
      height: 32px;
      fill: #0b0f19;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.03em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 400;
    }

    /* Stats Banner */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 1.5rem;
      text-align: center;
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease, border-color 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      opacity: 0.7;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      border-color: rgba(0, 242, 254, 0.3);
    }

    .stat-val {
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #fff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stat-lbl {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    /* Interactive Filters Panel */
    .filter-panel {
      background: rgba(17, 24, 39, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 1.5rem;
      margin-bottom: 2.5rem;
      backdrop-filter: blur(10px);
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: center;
      justify-content: space-between;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .filter-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .filter-select {
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      min-width: 180px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .filter-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.15);
    }

    .btn-reset {
      background: linear-gradient(135deg, rgba(255, 0, 127, 0.1), rgba(255, 0, 127, 0.2));
      border: 1px solid rgba(255, 0, 127, 0.3);
      color: #ff85a7;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s;
      align-self: flex-end;
    }

    .btn-reset:hover {
      background: linear-gradient(135deg, rgba(255, 0, 127, 0.2), rgba(255, 0, 127, 0.3));
      box-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }

    /* Listings Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 2rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(12px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.01);
      border-color: rgba(0, 242, 254, 0.25);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 242, 254, 0.05);
    }

    .card-header {
      padding: 1.5rem 1.5rem 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .brand-section {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .brand-badge {
      font-size: 1.4rem;
      font-weight: 750;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .model-name {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .platform-badge {
      padding: 0.35rem 0.75rem;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-skelbiu {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
    }

    .badge-autoplius {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .badge-autogidas {
      background: rgba(249, 115, 22, 0.15);
      border: 1px solid rgba(249, 115, 22, 0.3);
      color: #fdba74;
    }

    .card-body {
      padding: 0 1.5rem 1.5rem 1.5rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      background: rgba(17, 24, 39, 0.3);
      padding: 1rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .spec-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .spec-value {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
    }

    .price-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .price-box {
      display: flex;
      flex-direction: column;
    }

    .price-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .price-value {
      font-size: 1.7rem;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #fff 60%, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tread-badge {
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.25);
      color: var(--primary);
      padding: 0.4rem 0.8rem;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.05);
    }

    .tread-badge svg {
      width: 14px;
      height: 14px;
      fill: var(--primary);
    }

    /* Seller Info & Action Buttons */
    .card-footer {
      padding: 1.25rem 1.5rem 1.5rem 1.5rem;
      background: rgba(10, 15, 26, 0.5);
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .seller-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .seller-name {
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .seller-location {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 0.5rem;
    }

    .btn-action {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      color: #0b0f19;
      padding: 0.75rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .btn-action:hover {
      box-shadow: 0 0 15px var(--primary-glow);
      transform: translateY(-2px);
      opacity: 0.95;
    }

      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.75rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .btn-contact:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Modal / Toast Notifications */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: rgba(16, 185, 129, 0.9);
      color: white;
      padding: 1rem 2rem;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transform: translateY(150%);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .toast.show {
      transform: translateY(0);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }
      h1 {
        font-size: 2.2rem;
      }
      .filter-panel {
        flex-direction: column;
        align-items: stretch;
      }
      .filter-select {
        min-width: 100%;
      }
      .btn-reset {
        align-self: stretch;
      }

    const grid = document.getElementById('listings-grid');
    const filterPlatform = document.getElementById('filter-platform');
    const filterBrand = document.getElementById('filter-brand');
    const filterSort = document.getElementById('filter-sort');
    const btnReset = document.getElementById('btn-reset');
    const toast = document.getElementById('toast');

    // Render Function
    function renderListings(data) {
      grid.innerHTML = '';
      
      if (data.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-muted);">
            <svg style="width:48px;height:48px;fill:currentColor;opacity:0.5;margin-bottom:1rem" viewBox="0 0 24 24">
              <path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
            </svg>
            <h3 style="font-size:1.3rem;color:#fff;margin-bottom:0.5rem">Nerasta padangų</h3>
            <p>Pabandykite pasirinkti kitus filtravimo kriterijus.</p>
          </div>
        `;
        document.getElementById('stat-count').innerText = '0';
        document.getElementById('stat-avg').innerText = '—';
        document.getElementById('stat-best').innerText = '—';
        return;
      }

      document.getElementById('stat-count').innerText = data.length.toString();
      const avg = data.reduce((s, i) => s + i.price, 0) / data.length;
      document.getElementById('stat-avg').innerText = avg.toFixed(0) + ' €';
      const best = Math.min(...data.map(i => i.price));
      document.getElementById('stat-best').innerText = best + ' €';

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        
        let platformClass = 'badge-skelbiu';
        if (item.platform === 'Autoplius.lt') platformClass = 'badge-autoplius';
        if (item.platform === 'Autogidas.lt') platformClass = 'badge-autogidas';

        card.innerHTML = `
          <div class="card-header">
            <div class="brand-section">
              <span class="brand-badge">${item.brand}${item.recommended ? ' <span style="font-size:0.7rem;background:rgba(16,185,129,0.2);color:#6ee7b7;border:1px solid rgba(16,185,129,0.35);padding:0.15rem 0.45rem;border-radius:6px;vertical-align:middle;font-weight:600">★ REC</span>' : ''}</span>
              <span class="model-name">${item.model}</span>
            </div>
            <span class="platform-badge ${platformClass}">${item.platform}</span>
          </div>

          <div class="card-body">
            <div class="specs-grid">
              <div class="spec-item">
                <span class="spec-label">Išmatavimai</span>
                <span class="spec-value">205/55 R16</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">Metai (DOT)</span>
                <span class="spec-value">${item.year ? item.year + ' m.' : '—'}</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">Kiekis</span>
                <span class="spec-value">${item.quantity} vnt.</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">Likutis</span>
                <span class="spec-value">${item.treadPct}%</span>
              </div>
            </div>

            <div class="price-section">
              <div class="price-box">
                <span class="price-title">Kaina</span>
                <span class="price-value">${item.price} € <span style="font-size:1rem;font-weight:400;color:var(--text-muted)">/ vnt.</span></span>
              </div>
              
              <div class="tread-badge">
                <svg viewBox="0 0 24 24">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/>
                </svg>
                <span>${item.tread.toFixed(1)} mm</span>
              </div>
            </div>
          </div>

          <div class="card-footer">
            <div class="seller-row">
              <span class="seller-name">
                <svg style="width:16px;height:16px;fill:var(--text-muted)" viewBox="0 0 24 24">

                </svg>
                ${item.seller}
              </span>
              <span class="seller-location">
                <svg style="width:14px;height:14px;fill:var(--text-muted)" viewBox="0 0 24 24">
                  <path d="M12,2C11.3,2 6,7.5 6,11.5c0,3.3 2.7,6 6,6s6-2.7 6-6C18,7.5 12.7,2 12,2z M12,14c-1.4,0-2.5-1.1-2.5-2.5S10.6,9 12,9s2.5,1.1 2.5,2.5S13.4,14 12,14z" />
                </svg>
                ${item.location}
              </span>
            </div>

            <div class="phone-row" style="margin: 0.25rem 0 0.5rem 0; display: flex; align-items: center; gap: 0.5rem; background: rgba(0, 242, 254, 0.05); padding: 0.5rem 0.75rem; border-radius: 12px; border: 1px dashed rgba(0, 242, 254, 0.25);">
              <svg style="width:16px;height:16px;fill:var(--primary)" viewBox="0 0 24 24">
                <path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z" />
              </svg>
              <a href="${item.phone.includes('+') ? 'tel:' + item.phone : '#'}" style="color: var(--primary); text-decoration: none; font-weight: 700; font-size: 1rem; flex-grow: 1; letter-spacing: 0.02em;">
                ${item.phone}
              </a>
            </div>

            <div class="actions-grid">
              <a href="${item.link}" target="_blank" class="btn-action">
                <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24">
                  <path d="M14,3V5H17.59L7.76,14.83L9.17,16.24L19,6.41V10H21V3M19,19H5V5H12V3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V12H19V19Z" />
                </svg>
                Atidaryti skelbimą
              </a>
              <button class="btn-contact" onclick="copyNumber('${item.phone}')" title="Kopijuoti telefono numerį">
                <svg style="width:18px;height:18px;fill:currentColor" viewBox="0 0 24 24">
                  <path d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z" />
                </svg>
                Kopijuoti
              </button>
            </div>
          </div>
        `;
        
        grid.appendChild(card);
      });
    }

    // Copy to Clipboard Action
    window.copyNumber = function(number) {
      if (number.includes('+')) {
        navigator.clipboard.writeText(number).then(() => {
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 2500);
        });
      } else {
        alert("Šis skelbimas neturi tiesioginio telefono numerio (žr. skelbimo nuorodą).");
      }
    };

    // Filter Logic
    function applyFilters() {
      let filtered = [...listings];

      // Platform filter
      const platform = filterPlatform.value;
      if (platform !== 'all') {
        filtered = filtered.filter(item => item.platform === platform);
      }

      // Brand filter
      const brand = filterBrand.value;
      if (brand !== 'all') {
        filtered = filtered.filter(item => item.brand === brand);
      }

      // Sorting
      const sort = filterSort.value;
      if (sort === 'price-asc') {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sort === 'price-desc') {
        filtered.sort((a, b) => b.price - a.price);
      } else if (sort === 'tread-desc') {
        filtered.sort((a, b) => b.tread - a.tread);
      } else if (sort === 'year-desc') {
        filtered.sort((a, b) => (b.year || 0) - (a.year || 0));
      }

      renderListings(filtered);
    }

    // Event Listeners
    filterPlatform.addEventListener('change', applyFilters);
    filterBrand.addEventListener('change', applyFilters);
    filterSort.addEventListener('change', applyFilters);

    btnReset.addEventListener('click', () => {
      filterPlatform.value = 'all';
      filterBrand.value = 'all';
      filterSort.value = 'price-asc';
      applyFilters();
    });

    // Initial Render
    applyFilters();

  </script>
